<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The "K" from the KM constellation, simplified for tab size. Lines switch shade for light and dark tabs. -->
  <style>
    .l { stroke: #5a524a; }
    @media (prefers-color-scheme: dark) { .l { stroke: #cfc7bb; } }
  </style>
  <g class="l" stroke-width="2" stroke-linecap="round">
    <line x1="8.5" y1="4.5" x2="10" y2="16"/>
    <line x1="10" y1="16" x2="8" y2="27.5"/>
    <line x1="10" y1="16" x2="24" y2="5.5"/>
    <line x1="10" y1="16" x2="25.5" y2="26.5"/>
  </g>
  <g fill="#F5A623">
    <circle cx="8.5" cy="4.5" r="2.9"/>
    <circle cx="10" cy="16" r="4"/>
    <circle cx="8" cy="27.5" r="3.1"/>
    <circle cx="24" cy="5.5" r="3"/>
    <circle cx="25.5" cy="26.5" r="2.8"/>
  </g>
</svg>
